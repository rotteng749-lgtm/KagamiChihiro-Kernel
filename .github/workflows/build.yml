# ============================================================================
#  KagamiChihiro GKI 5.10 — GitHub Actions Build
#  Target: Infinix Note 30 (X6833B / MT6789)
#  Arch  : aarch64 (arm64)
# ============================================================================
name: Build KagamiChihiro Kernel

on:
  push:
    branches: [ chihiro-rebase ]
  workflow_dispatch:

permissions:
  contents: write

env:
  KERNELSU_VERSION: v3.3.0

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        ref: chihiro-rebase
        submodules: false
        fetch-depth: 0

    - name: Install build dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          clang lld llvm bc bison flex libssl-dev \
          libelf-dev gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
          zip curl git python3 python-is-python3 device-tree-compiler \
          cpio rsync

    - name: Apply build fixes
      run: python3 .github/workflows/fix-build.py

    - name: Setup KernelSU-Next ${{ env.KERNELSU_VERSION }}
      run: |
        # Clone KernelSU-Next at stable release tag
        if [ ! -d .deps/KernelSU-Next/kernel ]; then
          mkdir -p .deps
          git clone --depth=1 --branch ${{ env.KERNELSU_VERSION }} \
            https://github.com/KernelSU-Next/KernelSU-Next.git .deps/KernelSU-Next
        fi
        # Remove any old/broken symlink and recreate
        rm -f drivers/kernelsu
        ln -sf "$(pwd)/.deps/KernelSU-Next/kernel" drivers/kernelsu
        ls -la drivers/kernelsu/Kconfig || (echo 'ERROR: kernelsu Kconfig not found' && exit 1)
        grep -q 'CONFIG_KSU' drivers/Makefile || \
          printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
        grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig || \
          sed -i '/endmenu/i\tsource "drivers/kernelsu/Kconfig"' drivers/Kconfig
        echo "KernelSU-Next ${{ env.KERNELSU_VERSION }} wired OK"

    - name: Generate kernel defconfig
      run: make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig

    - name: Build kernel Image
      run: |
        make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 -j$(nproc) Image Image.gz 2>&1 | \
          tee out/build.log | grep -iE 'error|fatal|Kernel: arch' | tail -50
        if [ ! -f out/arch/arm64/boot/Image.gz ]; then
          echo "Build failed - full log:"
          tail -100 out/build.log
          exit 1
        fi
        echo "Kernel built: $(ls -lh out/arch/arm64/boot/Image.gz)"

    - name: Package AnyKernel3 zip
      run: |
        if [ ! -d .deps/AnyKernel3 ]; then
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git .deps/AnyKernel3
        fi
        PKG="out/AnyKernel3"
        rm -rf "$PKG"
        cp -r .deps/AnyKernel3 "$PKG"
        cp out/arch/arm64/boot/Image "$PKG/Image"
        cp out/arch/arm64/boot/Image.gz "$PKG/Image.gz"

        # Write a clean anykernel.sh for GKI device
        cat > "$PKG/anykernel.sh" << 'AKEOF'
### AnyKernel3 Ramdisk Mod Script
## osm0sis @ xda-developers

### AnyKernel setup
# global properties
properties() { '
kernel.string=KagamiChihiro 5.10.260
do.devicecheck=0
do.modules=0
do.systemless=0
do.cleanup=1
do.cleanuponabort=0
device.name1=
device.name2=
device.name3=
device.name4=
device.name5=
supported.versions=
supported.patchlevels=
supported.vendorpatchlevels=
'; } # end properties

### AnyKernel install
## boot shell variables
BLOCK=boot;
IS_SLOT_DEVICE=auto;
RAMDISK_COMPRESSION=auto;
PATCH_VBMETA_FLAG=auto;

# import functions/variables and setup patching - see for reference (DO NOT REMOVE)
. tools/ak3-core.sh;

ui_print " "
ui_print "KagamiChihiro Kernel 5.10.260"
ui_print "Target: Infinix Note 30 (X6833B / MT6789)"
ui_print " "

# boot install
if [ -L "/dev/block/bootdevice/by-name/init_boot_a" -o -L "/dev/block/by-name/init_boot_a" ]; then
    split_boot
    flash_boot
else
    dump_boot
    write_boot
fi
AKEOF

        cd "$PKG"
        zip -r9 "../KagamiChihiro-5.10.260.zip" . -x '*.git*' -x '*.placeholder'
        cd -
        echo "Zip: $(ls -lh out/KagamiChihiro-5.10.260.zip)"

    - name: Upload kernel zip (artifact)
      uses: actions/upload-artifact@v4
      with:
        name: KagamiChihiro-5.10.260
        path: out/KagamiChihiro-5.10.260.zip
        retention-days: 14
        if-no-files-found: error

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        name: "KagamiChihiro 5.10.260 (Build #${{ github.run_number }})"
        body: |
          ## KagamiChihiro Kernel 5.10.260

          **Target:** Infinix Note 30 (X6833B / MT6789)
          **Arch:** aarch64 (arm64)
          **KernelSU-Next:** ${{ env.KERNELSU_VERSION }}
          **Commit:** ${{ github.sha }}

          ### Install
          1. Reboot to recovery
          2. Flash `KagamiChihiro-5.10.260.zip`
          3. Reboot

          ### Changelog
          - Auto-built from commit ${{ github.sha }}
        files: out/KagamiChihiro-5.10.260.zip
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
